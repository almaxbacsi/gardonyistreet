<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gárdonyi Géza utca – Piliscsaba</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb6c8; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      canvas#c { display: block; width: 100vw; height: 100vh; }
      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, rgba(20,28,18,0.55), rgba(10,14,10,0.85));
        color: #f3efe4; cursor: pointer; transition: opacity .3s; z-index: 10;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      .card { max-width: 520px; padding: 32px 36px; border-radius: 14px; background: rgba(20,24,18,0.6); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.12); }
      .card h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: .3px; }
      .card .sub { margin: 0 0 20px; opacity: .75; }
      .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; margin-bottom: 22px; }
      .keys kbd { display: inline-block; min-width: 18px; padding: 2px 7px; border-radius: 5px; background: #f3efe4; color: #1e221a; font: 600 12px system-ui; text-align: center; margin-right: 3px; }
      #start { font-weight: 600; font-size: 16px; padding: 10px 0 0; }
      #gfx { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 16px; font-size: 13px; cursor: default; }
      #gfx span { opacity: .8; margin-right: 4px; }
      #gfx button { font: 600 12px system-ui; padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #f3efe4; cursor: pointer; }
      #gfx button.on { background: #f3efe4; color: #1e221a; }
      #gfx .note { flex-basis: 100%; font-size: 12px; opacity: .75; }
      #progress { font-size: 13px; opacity: .7; margin-top: 8px; min-height: 18px; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
      #addr { position: absolute; left: 18px; bottom: 16px; display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
      #addr span { font-size: 12px; opacity: .8; }
      #fps { position: absolute; left: 12px; top: 10px; font: 600 11px ui-monospace, monospace; opacity: .7; }
      #minimap { position: absolute; right: 16px; top: 16px; width: 170px; height: 170px; border-radius: 50%; box-shadow: 0 2px 12px rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.6); }
      #toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); background: rgba(15,18,14,.7); padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .3s; }
      #toast.show { opacity: 1; }
      .devlabel { font: 600 11px ui-monospace, monospace; color: #fff; background: rgba(10,12,10,.72); border: 1px solid; border-radius: 4px; padding: 1px 5px; white-space: nowrap; transform: translateY(-50%); }
      .devlabel.picked { background: #ffeb3b; color: #111; }
      #devinfo { display: none; position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%); z-index: 6; font: 12px ui-monospace, monospace; color: #fff; background: rgba(10,12,10,.7); padding: 5px 10px; border-radius: 6px; pointer-events: none; }
      #hotbar { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 4px; }
      #hotbar .slot { font-size: 11px; padding: 4px 8px; border-radius: 6px; background: rgba(15,18,14,.45); border: 1px solid rgba(255,255,255,.15); opacity: .75; }
      #hotbar .slot b { margin-right: 5px; opacity: .7; }
      #hotbar .slot.on { background: rgba(243,239,228,.9); color: #1e221a; text-shadow: none; opacity: 1; }
      #cross.fps { background: rgba(255,255,255,.85); box-shadow: 0 0 2px rgba(0,0,0,.8); }
      #cross { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,255,255,.5); }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="fps"></div>
      <canvas id="minimap" width="170" height="170"></canvas>
      <div id="addr"></div>
      <div id="toast"></div>
      <div id="cross"></div>
    </div>
    <div id="overlay">
      <div class="card">
        <h1>Gárdonyi Géza utca</h1>
        <p class="sub">Piliscsaba, Márialiget</p>
        <div class="keys">
          <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div><div>move</div>
          <div><kbd>Mouse</kbd></div><div>look around</div>
          <div><kbd>Shift</kbd></div><div>run</div>
          <div><kbd>Space</kbd></div><div>jump</div>
          <div><kbd>Left click</kbd></div><div>use tool</div>
          <div><kbd>1</kbd>–<kbd>7</kbd> <kbd>Wheel</kbd></div><div>switch tool (<kbd>0</kbd> empty hands)</div>
          <div><kbd>V</kbd></div><div>first / third person</div>
          <div><kbd>C</kbd></div><div>camera distance (third person)</div>
          <div><kbd>Esc</kbd></div><div>pause</div>
          <div><kbd>F2</kbd></div><div>dev mode (object ids)</div>
        </div>
        <div id="start">Loading…</div>
        <div id="progress"></div>
        <div id="gfx"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
